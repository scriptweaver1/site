                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="20" height="20">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z" />
                                </svg>
                                Unlock Full Script
                            </button>
                            ${script.patreonLink ? `
                            <a href="${escapeHtml(script.patreonLink)}" class="preview-modal-btn patreon" target="_blank" rel="noopener noreferrer">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                                    <path d="M15.386.524c-4.764 0-8.64 3.876-8.64 8.64 0 4.75 3.876 8.613 8.64 8.613 4.75 0 8.614-3.864 8.614-8.613C24 4.4 20.136.524 15.386.524M.003 23.537h4.22V.524H.003"/>
                                </svg>
                                Get Password on Patreon
                            </a>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `;

            // Setup scroll detection for auto-showing modal
            setupPreviewScrollDetection();

            // Add Enter key handler for top bar input
            const topBarInput = document.getElementById('topBarPasswordInput');
            if (topBarInput) {
                topBarInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        submitTopBarUnlock(script.id);
                    }
                });
            }

            // Add Enter key handler for modal input
            const modalInput = document.getElementById('previewModalInput');
            if (modalInput) {
                modalInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        submitPreviewModal(script.id);
                    }
                });
            }

            // Close modal on overlay click
            const overlay = document.getElementById('previewModalOverlay');
            if (overlay) {
                overlay.addEventListener('click', (e) => {
                    if (e.target === overlay) {
                        hidePreviewModal();
                    }
                });
            }

            // Close modal on Escape key
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    hidePreviewModal();
                }
            });
        }

        // Track if modal has been shown this session
        let previewModalShown = false;
        let previewModalTimeout = null;

        // Setup scroll detection for preview pages
        function setupPreviewScrollDetection() {
            const checkScrollPosition = () => {
                // Check if user has scrolled near the bottom
                const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
                const scrollHeight = document.documentElement.scrollHeight;
                const clientHeight = document.documentElement.clientHeight;
                
                // If within 100px of bottom and modal hasn't been shown yet
                if (scrollTop + clientHeight >= scrollHeight - 100 && !previewModalShown) {
                    previewModalShown = true;
                    
                    // Show modal after 2 second delay
                    previewModalTimeout = setTimeout(() => {
                        showPreviewModal();
                    }, 2000);
                }
            };

            window.addEventListener('scroll', checkScrollPosition);
            // Also check on load in case content is short
            checkScrollPosition();
        }

        // Show the preview unlock modal
        function showPreviewModal() {
            const overlay = document.getElementById('previewModalOverlay');
            if (overlay) {
                overlay.classList.add('active');
                document.body.style.overflow = 'hidden'; // Prevent background scroll
                
                // Focus the input
                setTimeout(() => {
                    const input = document.getElementById('previewModalInput');
                    if (input) input.focus();
                }, 100);
            }
        }

        // Hide the preview unlock modal
        function hidePreviewModal() {
            const overlay = document.getElementById('previewModalOverlay');
            if (overlay) {
                overlay.classList.remove('active');
                document.body.style.overflow = ''; // Restore scroll
            }
            
            // Clear any pending timeout
            if (previewModalTimeout) {
                clearTimeout(previewModalTimeout);
                previewModalTimeout = null;
            }
        }

        // Handle preview modal unlock submission
        async function submitPreviewModal(scriptId) {
            const input = document.getElementById('previewModalInput');
            const errorEl = document.getElementById('previewModalError');
            const loadingEl = document.getElementById('previewModalLoading');
            const unlockBtn = document.getElementById('previewModalUnlockBtn');
            
            if (!input) return;
            
            const password = input.value.trim();
            
            if (!password) {
                errorEl.textContent = 'Please enter a password.';
                errorEl.style.display = 'block';
                input.classList.add('error');
                return;
            }
            
            // Show loading state
            errorEl.style.display = 'none';
            loadingEl.style.display = 'block';
            unlockBtn.disabled = true;
            input.disabled = true;
            
            try {
                const response = await fetch(`${CONFIG.workerApiUrl}/api/patreon-script/${scriptId}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ password: password })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    // Password valid! Store access for this session
                    sessionStorage.setItem(`patreon_access_${scriptId}`, 'granted');
                    sessionStorage.setItem(`patreon_pw_${scriptId}`, password);
                    
                    // Hide modal and restore scroll
                    hidePreviewModal();
                    
                    // Render the full script
                    renderScript(currentScriptData, data.content, allScriptsData, data.condensedContent || null);
                    
                    // Scroll to top to see full content
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    
                    // Setup scroll tracking
                    setupScrollTracking(scriptId);
                    
                } else {
                    // Password invalid
                    loadingEl.style.display = 'none';
                    errorEl.textContent = data.error || 'Incorrect password. Please try again.';
                    errorEl.style.display = 'block';
                    input.classList.add('error');
                    unlockBtn.disabled = false;
                    input.disabled = false;
                    input.focus();
                    input.select();
                }
                
            } catch (error) {
                console.error('API Error:', error);
                loadingEl.style.display = 'none';
                errorEl.textContent = 'Connection error. Please try again.';
                errorEl.style.display = 'block';
                unlockBtn.disabled = false;
                input.disabled = false;
            }
        }

        // Handle top bar unlock submission
        async function submitTopBarUnlock(scriptId) {
            const input = document.getElementById('topBarPasswordInput');
            const errorEl = document.getElementById('topBarError');
            const unlockBtn = document.getElementById('topBarUnlockBtn');
            
            if (!input) return;
            
            const password = input.value.trim();
            
            if (!password) {
                errorEl.textContent = 'Please enter a password.';
                errorEl.style.display = 'block';
                return;
            }
            
            // Show loading state
            errorEl.style.display = 'none';
            unlockBtn.disabled = true;
            unlockBtn.innerHTML = `
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="16" height="16" class="animate-spin">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
                Verifying...
            `;
            input.disabled = true;
            
            try {
                const response = await fetch(`${CONFIG.workerApiUrl}/api/patreon-script/${scriptId}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ password: password })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    // Password valid! Store access for this session
                    sessionStorage.setItem(`patreon_access_${scriptId}`, 'granted');
                    sessionStorage.setItem(`patreon_pw_${scriptId}`, password);
                    
                    // Render the full script
                    renderScript(currentScriptData, data.content, allScriptsData, data.condensedContent || null);
                    
                    // Scroll to top to see full content
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    
                    // Setup scroll tracking
                    setupScrollTracking(scriptId);
                    
                } else {
                    // Password invalid
                    errorEl.textContent = data.error || 'Incorrect password. Please try again.';
                    errorEl.style.display = 'block';
                    unlockBtn.disabled = false;
                    unlockBtn.innerHTML = `
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="16" height="16">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z" />
                        </svg>
                        Unlock
                    `;
                    input.disabled = false;
                    input.focus();
                    input.select();
                }
                
            } catch (error) {
                console.error('API Error:', error);
                errorEl.textContent = 'Connection error. Please try again.';
                errorEl.style.display = 'block';
                unlockBtn.disabled = false;
                unlockBtn.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="16" height="16">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z" />
                    </svg>
                    Unlock
                `;
                input.disabled = false;
            }
        }

        // Main initialization
        async function init() {
            const scriptId = getScriptId();

            if (!scriptId) {
                renderError('No script ID provided. Please select a script from the masterlist.');
                return;
            }

            try {
                // Load scripts data
                const response = await fetch(CONFIG.dataPath);
                if (!response.ok) throw new Error('Failed to load scripts data');
                
                const data = await response.json();
                const allScripts = data.scripts || [];
                const script = allScripts.find(s => s.id === scriptId);

                if (!script) {
                    renderError(`Script with ID ${scriptId} was not found.`);
                    return;
                }

                // Store for use in submitPatreonGateKey
                currentScriptData = script;
                allScriptsData = allScripts;

                // Handle Patreon-only scripts
                if (script.patreonOnly) {
                    // Check if already verified this session
                    if (!verifyPatreonAccess(script)) {
                        // Not verified - check if preview is available
                        if (script.previewFile) {
                            try {
                                const previewResponse = await fetch(script.previewFile);
                                if (previewResponse.ok) {
                                    const previewContent = await previewResponse.text();
                                    renderPatreonPreview(script, previewContent, allScripts);
                                    return;
                                }
                            } catch (e) {
                                console.error('Failed to load preview:', e);
                            }
                        }
                        // No preview or preview failed to load - show regular gate
                        renderPatreonGate(script);
                        return;
                    }
                    
                    // Already verified - re-fetch content from API with saved password
                    const savedPassword = sessionStorage.getItem(`patreon_pw_${scriptId}`);
                    if (savedPassword) {
                        try {
                            const apiResponse = await fetch(`${CONFIG.workerApiUrl}/api/patreon-script/${scriptId}`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ password: savedPassword })
                            });
                            const apiData = await apiResponse.json();
                            if (apiResponse.ok && apiData.success) {
                                renderScript(script, apiData.content, allScripts, apiData.condensedContent || null);
                                setupScrollTracking(scriptId);
                                return;
                            }
                        } catch (e) {
                            console.error('Failed to re-fetch:', e);
                        }
                    }
                    
                    // Couldn't get content, show gate again (with preview if available)
                    sessionStorage.removeItem(`patreon_access_${scriptId}`);
                    if (script.previewFile) {
                        try {
                            const previewResponse = await fetch(script.previewFile);
                            if (previewResponse.ok) {
                                const previewContent = await previewResponse.text();
                                renderPatreonPreview(script, previewContent, allScripts);
                                return;
                            }
                        } catch (e) {
                            console.error('Failed to load preview:', e);
                        }
                    }
                    renderPatreonGate(script);
                    return;
                }

                // Regular (non-Patreon) script handling
                if (!script.contentFile) {
                    renderError('This script does not have content available for reading yet.');
                    return;
                }

                // Load the markdown content
                const contentResponse = await fetch(script.contentFile);
                if (!contentResponse.ok) {
                    renderError('Failed to load script content. The file may be missing.');
                    return;
                }

                const content = await contentResponse.text();
                
                // Load condensed content if available
                let condensedContent = null;
                if (script.contentFileCondensed) {
                    try {
                        const condensedResponse = await fetch(script.contentFileCondensed);
                        if (condensedResponse.ok) {
                            condensedContent = await condensedResponse.text();
                        }
                    } catch (e) {
                        console.warn('Could not load condensed version:', e);
                    }
                }
                
                renderScript(script, content, allScripts, condensedContent);

                // Setup scroll position tracking
                setupScrollTracking(scriptId);

            } catch (error) {
                console.error('Error:', error);
                renderError('An error occurred while loading the script.');
            }
        }

        // Start
        init();
    </script>

    <!-- Accessibility Script -->
    <script>
        // Accessibility Settings
        const accessibilitySettings = {
            fontSize: parseInt(localStorage.getItem('accessFontSize')) || 16,
            fontType: localStorage.getItem('accessFontType') || 'default'
        };

        const fontSizes = [12, 14, 16, 18, 20, 22, 24, 28, 32];

        // DOM Elements
        const accessibilityBtn = document.getElementById('accessibilityBtn');
        const accessibilityPanel = document.getElementById('accessibilityPanel');
        const accessibilityOverlay = document.getElementById('accessibilityOverlay');
        const accessibilityClose = document.getElementById('accessibilityClose');
        const fontSizeDecrease = document.getElementById('fontSizeDecrease');
        const fontSizeIncrease = document.getElementById('fontSizeIncrease');
        const fontSizeDisplay = document.getElementById('fontSizeDisplay');
        const fontTypeBtns = document.querySelectorAll('.font-type-btn');
        const accessibilityReset = document.getElementById('accessibilityReset');

        // Open/Close Panel
        function openAccessibilityPanel() {
            accessibilityPanel.classList.add('open');
            accessibilityOverlay.classList.add('open');
        }

        function closeAccessibilityPanel() {
            accessibilityPanel.classList.remove('open');
            accessibilityOverlay.classList.remove('open');
        }

        accessibilityBtn.addEventListener('click', openAccessibilityPanel);
        accessibilityClose.addEventListener('click', closeAccessibilityPanel);
        accessibilityOverlay.addEventListener('click', closeAccessibilityPanel);

        // Font Size
        function updateFontSize(size) {
            accessibilitySettings.fontSize = size;
            localStorage.setItem('accessFontSize', size);
            fontSizeDisplay.textContent = size;
            document.documentElement.style.fontSize = size + 'px';
        }

        fontSizeDecrease.addEventListener('click', () => {
            const currentIndex = fontSizes.indexOf(accessibilitySettings.fontSize);
            if (currentIndex > 0) {
                updateFontSize(fontSizes[currentIndex - 1]);
            }
        });

        fontSizeIncrease.addEventListener('click', () => {
            const currentIndex = fontSizes.indexOf(accessibilitySettings.fontSize);
            if (currentIndex < fontSizes.length - 1) {
                updateFontSize(fontSizes[currentIndex + 1]);
            }
        });

        // Font Type
        function updateFontType(type) {
            accessibilitySettings.fontType = type;
            localStorage.setItem('accessFontType', type);
            
            // Remove all font classes
            document.body.classList.remove('font-arial', 'font-times', 'font-atkinson', 'font-dyslexic');
            
            // Add new font class if not default
            if (type !== 'default') {
                document.body.classList.add('font-' + type);
            }
            
            // Update active button
            fontTypeBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.font === type);
            });
        }

        fontTypeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                updateFontType(btn.dataset.font);
            });
        });

        // Reset
        accessibilityReset.addEventListener('click', () => {
            updateFontSize(16);
            updateFontType('default');
        });

        // Apply saved settings on load
        function applyAccessibilitySettings() {
            updateFontSize(accessibilitySettings.fontSize);
            updateFontType(accessibilitySettings.fontType);
        }

        applyAccessibilitySettings();
    </script>
