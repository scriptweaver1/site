<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Read script on The Immaterial Loom">
    <meta name="theme-color" content="#6b3fa0">
    
    <title>Reading... | The Immaterial Loom</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Raleway:wght@300;400;500;600&family=Crimson+Pro:ital,wght@0,400;0,600;1,400;1,600&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    
    <!-- OpenDyslexic Font -->
    <link href="https://fonts.cdnfonts.com/css/opendyslexic" rel="stylesheet">
    
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <style>
        :root {
            --cosmic-black: #0a0a12;
            --deep-space: #12101f;
            --nebula-purple: #2d1b4e;
            --stellar-purple: #6b3fa0;
            --nova-pink: #d946a8;
            --cosmic-pink: #f472b6;
            --stardust: #e9d5ff;
            --pure-light: #faf5ff;
            --accent-blue: #1e3a5f;
            --glow-purple: rgba(107, 63, 160, 0.5);
            --glow-pink: rgba(217, 70, 168, 0.4);
            --reading-bg: #13111d;
            --reading-text: #e8e0f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Raleway', sans-serif;
            background: var(--cosmic-black);
            color: var(--stardust);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Galaxy Background */
        .galaxy-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(107, 63, 160, 0.2) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(217, 70, 168, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 60% 30%, rgba(30, 58, 95, 0.3) 0%, transparent 40%),
                linear-gradient(180deg, var(--cosmic-black) 0%, var(--deep-space) 50%, var(--cosmic-black) 100%);
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-image: 
                radial-gradient(1px 1px at 100px 50px, var(--stardust), transparent),
                radial-gradient(1px 1px at 200px 150px, var(--cosmic-pink), transparent),
                radial-gradient(1px 1px at 300px 100px, var(--pure-light), transparent),
                radial-gradient(1px 1px at 400px 200px, var(--stardust), transparent),
                radial-gradient(1px 1px at 500px 80px, var(--cosmic-pink), transparent);
            background-size: 550px 300px;
            opacity: 0.5;
        }

        /* Header */
        header {
            padding: 1.5rem 2rem;
            border-bottom: 1px solid rgba(107, 63, 160, 0.3);
            backdrop-filter: blur(10px);
            background: rgba(10, 10, 18, 0.8);
            position: relative;
            z-index: 100;
        }

        .header-content {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--cosmic-pink);
            text-decoration: none;
            font-weight: 500;
            padding: 0.6rem 1rem;
            border-radius: 25px;
            border: 1px solid rgba(217, 70, 168, 0.4);
            transition: all 0.3s ease;
        }

        .back-link:hover {
            background: rgba(217, 70, 168, 0.2);
            border-color: var(--nova-pink);
        }

        .back-link svg {
            width: 18px;
            height: 18px;
        }

        .logo-mini {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            text-decoration: none;
        }

        .logo-mini-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--stellar-purple), var(--nova-pink));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            color: var(--pure-light);
        }

        .logo-mini-text {
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--stardust);
        }

        /* Main Content */
        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 3rem 2rem 5rem;
        }

        /* Script Header */
        .script-header {
            text-align: center;
            margin-bottom: 3rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid rgba(107, 63, 160, 0.3);
        }

        .script-category {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--cosmic-pink);
            margin-bottom: 1rem;
            padding: 0.4rem 1rem;
            background: rgba(217, 70, 168, 0.15);
            border-radius: 20px;
            border: 1px solid rgba(217, 70, 168, 0.3);
        }

        .script-title {
            font-family: 'Cinzel', serif;
            font-size: 2.8rem;
            font-weight: 700;
            color: var(--pure-light);
            margin-bottom: 1.5rem;
            line-height: 1.2;
            background: linear-gradient(135deg, var(--pure-light) 0%, var(--cosmic-pink) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .script-tags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .script-tag {
            background: rgba(107, 63, 160, 0.3);
            color: var(--stardust);
            padding: 0.4rem 0.9rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            border: 1px solid rgba(107, 63, 160, 0.4);
        }

        .script-tags-hidden {
            display: none;
        }

        .script-tags-hidden.visible {
            display: contents;
        }

        .script-tags-toggle {
            background: rgba(217, 70, 168, 0.2);
            color: var(--cosmic-pink);
            padding: 0.4rem 0.9rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid rgba(217, 70, 168, 0.4);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .script-tags-toggle:hover {
            background: rgba(217, 70, 168, 0.3);
            border-color: rgba(217, 70, 168, 0.6);
        }

        .script-meta {
            color: rgba(233, 213, 255, 0.6);
            font-size: 0.9rem;
        }

        .script-meta a {
            color: var(--cosmic-pink);
            text-decoration: none;
        }

        .script-meta a:hover {
            text-decoration: underline;
        }

        /* Script Cover Image */
        .script-cover {
            margin: 2rem auto;
            max-width: 500px;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(107, 63, 160, 0.3);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }

        .script-cover img {
            width: 100%;
            height: auto;
            display: block;
        }

        .script-cover-credit {
            padding: 0.6rem 1rem;
            background: rgba(10, 10, 18, 0.8);
            font-size: 0.8rem;
            color: rgba(233, 213, 255, 0.7);
            text-align: center;
        }

        .script-cover-credit a {
            color: var(--cosmic-pink);
            text-decoration: none;
        }

        .script-cover-credit a:hover {
            text-decoration: underline;
        }

        /* Fills Section */
        .fills-section {
            margin: 2.5rem 0;
            padding: 1.5rem 2rem;
            background: linear-gradient(135deg, rgba(217, 70, 168, 0.1) 0%, rgba(107, 63, 160, 0.15) 100%);
            border-radius: 16px;
            border: 1px solid rgba(217, 70, 168, 0.3);
        }

        .fills-title {
            font-family: 'Cinzel', serif;
            font-size: 1.3rem;
            color: var(--cosmic-pink);
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .fills-title svg {
            width: 24px;
            height: 24px;
        }

        .fills-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .fill-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.8rem;
            padding: 0.8rem 1rem;
            background: rgba(10, 10, 18, 0.5);
            border-radius: 10px;
            border: 1px solid rgba(107, 63, 160, 0.2);
        }

        .fill-artists {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.95rem;
            color: var(--stardust);
        }

        .fill-artists a {
            color: var(--cosmic-pink);
            text-decoration: none;
            font-weight: 500;
        }

        .fill-artists a:hover {
            text-decoration: underline;
        }

        .fill-artists .artist-separator {
            color: rgba(233, 213, 255, 0.5);
        }

        .fill-link {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.4rem 0.9rem;
            background: rgba(255, 69, 0, 0.2);
            color: #ff6b35;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-decoration: none;
            border: 1px solid rgba(255, 69, 0, 0.4);
            transition: all 0.2s ease;
        }

        .fill-link:hover {
            background: rgba(255, 69, 0, 0.4);
            box-shadow: 0 0 15px rgba(255, 69, 0, 0.3);
        }

        .fill-link svg {
            width: 14px;
            height: 14px;
        }

        /* Share Buttons Section */
        .share-section {
            margin: 2rem 0;
            text-align: center;
        }

        .share-title {
            font-size: 0.85rem;
            color: rgba(233, 213, 255, 0.7);
            margin-bottom: 1rem;
        }

        .share-buttons {
            display: flex;
            justify-content: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .share-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .share-btn svg {
            width: 20px;
            height: 20px;
        }

        .share-btn.reddit {
            background: rgba(255, 69, 0, 0.2);
            color: #ff6b35;
            border: 1px solid rgba(255, 69, 0, 0.4);
        }

        .share-btn.reddit:hover {
            background: rgba(255, 69, 0, 0.4);
            box-shadow: 0 0 15px rgba(255, 69, 0, 0.3);
        }

        .share-btn.twitter {
            background: rgba(29, 161, 242, 0.2);
            color: #1da1f2;
            border: 1px solid rgba(29, 161, 242, 0.4);
        }

        .share-btn.twitter:hover {
            background: rgba(29, 161, 242, 0.4);
            box-shadow: 0 0 15px rgba(29, 161, 242, 0.3);
        }

        .share-btn.bluesky {
            background: rgba(0, 133, 255, 0.2);
            color: #0085ff;
            border: 1px solid rgba(0, 133, 255, 0.4);
        }

        .share-btn.bluesky:hover {
            background: rgba(0, 133, 255, 0.4);
            box-shadow: 0 0 15px rgba(0, 133, 255, 0.3);
        }

        .share-btn.discord {
            background: rgba(88, 101, 242, 0.2);
            color: #5865f2;
            border: 1px solid rgba(88, 101, 242, 0.4);
        }

        .share-btn.discord:hover {
            background: rgba(88, 101, 242, 0.4);
            box-shadow: 0 0 15px rgba(88, 101, 242, 0.3);
        }

        .share-btn.copy {
            background: rgba(107, 63, 160, 0.2);
            color: var(--cosmic-pink);
            border: 1px solid rgba(107, 63, 160, 0.4);
        }

        .share-btn.copy:hover {
            background: rgba(107, 63, 160, 0.4);
            box-shadow: 0 0 15px var(--glow-purple);
        }

        .share-btn.copy.copied {
            background: rgba(34, 197, 94, 0.3);
            color: #22c55e;
            border-color: rgba(34, 197, 94, 0.5);
        }

        /* Script Version Toggle */
        .version-toggle-container {
            display: flex;
            justify-content: center;
            margin: 1.5rem 0;
        }

        .version-toggle {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.6rem 1.2rem;
            background: rgba(45, 27, 78, 0.4);
            border: 1px solid rgba(107, 63, 160, 0.4);
            border-radius: 30px;
        }

        .version-toggle-label {
            font-size: 0.85rem;
            color: var(--stardust);
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .version-toggle-label.active {
            color: var(--cosmic-pink);
            font-weight: 600;
        }

        .version-toggle-switch {
            position: relative;
            width: 50px;
            height: 26px;
            background: rgba(107, 63, 160, 0.3);
            border-radius: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(107, 63, 160, 0.5);
        }

        .version-toggle-switch::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            background: linear-gradient(135deg, var(--stellar-purple), var(--nova-pink));
            border-radius: 50%;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px var(--glow-pink);
        }

        .version-toggle-switch.condensed::after {
            left: calc(100% - 22px);
        }

        .version-toggle-switch:hover {
            border-color: var(--nova-pink);
        }

        .version-info {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.75rem;
            color: rgba(233, 213, 255, 0.5);
            margin-left: 0.5rem;
        }

        .version-info svg {
            width: 14px;
            height: 14px;
        }

        /* Related Scripts Section */
        .related-section {
            margin: 3rem 0;
            padding: 2rem;
            background: rgba(45, 27, 78, 0.3);
            border-radius: 20px;
            border: 1px solid rgba(107, 63, 160, 0.3);
        }

        .related-title {
            font-family: 'Cinzel', serif;
            font-size: 1.3rem;
            color: var(--cosmic-pink);
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .related-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* Compact Horizontal Card Styles for Related Scripts */
        .related-section .script-card {
            background: linear-gradient(160deg, rgba(45, 27, 78, 0.6) 0%, rgba(18, 16, 31, 0.9) 100%);
            border: 1px solid rgba(107, 63, 160, 0.3);
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.3s ease;
            position: relative;
            cursor: pointer;
            display: grid;
            grid-template-columns: 140px 1fr;
            min-height: 120px;
        }

        .related-section .script-card:hover {
            border-color: var(--nova-pink);
            transform: translateX(5px);
            box-shadow: 0 5px 25px rgba(217, 70, 168, 0.2);
        }

        .related-section .card-image-container {
            position: relative;
            overflow: hidden;
            height: 100%;
        }

        .related-section .card-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .related-section .script-card:hover .card-image {
            transform: scale(1.05);
        }

        .related-section .card-placeholder-image {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(107, 63, 160, 0.3), rgba(217, 70, 168, 0.2));
            font-size: 2rem;
        }

        .related-section .card-artist-credit {
            position: absolute;
            bottom: 0.4rem;
            right: 0.4rem;
            background: rgba(10, 10, 18, 0.85);
            padding: 0.2rem 0.5rem;
            border-radius: 10px;
            font-size: 0.6rem;
            color: rgba(233, 213, 255, 0.8);
            backdrop-filter: blur(4px);
        }

        .related-section .card-artist-credit a {
            color: var(--cosmic-pink);
            text-decoration: none;
        }

        .related-section .card-artist-credit a:hover {
            text-decoration: underline;
        }

        .related-section .card-content {
            padding: 0.8rem 1rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 0.3rem;
        }

        .related-section .card-category {
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--cosmic-pink);
            margin-bottom: 0;
        }

        .related-section .card-title {
            font-family: 'Cinzel', serif;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--pure-light);
            margin-bottom: 0;
            line-height: 1.25;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .related-section .card-tags {
            display: none;
        }

        .related-section .card-synopsis {
            display: none;
        }

        .related-section .card-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-top: 0.3rem;
        }

        .related-section .card-link {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            color: var(--cosmic-pink);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.7rem;
            transition: all 0.3s ease;
            padding: 0.35rem 0.7rem;
            border-radius: 15px;
            border: 1px solid var(--nova-pink);
            background: transparent;
        }

        .related-section .card-link-primary {
            background: linear-gradient(135deg, var(--stellar-purple), var(--nova-pink));
            color: var(--pure-light);
            border: none;
        }

        .related-section .card-link-primary:hover {
            box-shadow: 0 0 15px var(--glow-pink);
        }

        .related-section .card-link-secondary {
            background: transparent;
            color: var(--cosmic-pink);
            border: 1px solid rgba(217, 70, 168, 0.5);
        }

        .related-section .card-link-secondary:hover {
            background: rgba(217, 70, 168, 0.2);
            border-color: var(--nova-pink);
        }

        .related-section .card-link-patreon {
            background: linear-gradient(135deg, #ff5500, #ff7733);
            color: #fff;
            border: none;
            box-shadow: 0 0 10px rgba(255, 85, 0, 0.3);
        }

        .related-section .card-link-patreon:hover {
            box-shadow: 0 0 15px rgba(255, 85, 0, 0.5);
        }

        .related-section .card-link svg {
            width: 12px;
            height: 12px;
        }

        @media (max-width: 768px) {
            .related-section .script-card {
                grid-template-columns: 100px 1fr;
                min-height: 100px;
            }
            
            .related-section .card-title {
                font-size: 0.85rem;
            }

            .related-section .card-link {
                font-size: 0.65rem;
                padding: 0.3rem 0.6rem;
            }
        }


        /* Series Navigation - Dropdown at top */
        .series-dropdown {
            margin-bottom: 2rem;
            padding: 1.2rem 1.5rem;
            background: linear-gradient(135deg, rgba(45, 27, 78, 0.5), rgba(107, 63, 160, 0.3));
            border: 1px solid rgba(107, 63, 160, 0.4);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .series-label {
            font-size: 0.9rem;
            color: var(--cosmic-pink);
            font-weight: 600;
        }

        .series-select {
            background: rgba(18, 16, 31, 0.8);
            border: 1px solid rgba(107, 63, 160, 0.5);
            border-radius: 10px;
            padding: 0.6rem 1rem;
            color: var(--stardust);
            font-size: 0.9rem;
            cursor: pointer;
            min-width: 250px;
            transition: all 0.2s ease;
        }

        .series-select:hover {
            border-color: var(--nova-pink);
        }

        .series-select:focus {
            outline: none;
            border-color: var(--nova-pink);
            box-shadow: 0 0 15px var(--glow-pink);
        }

        .series-select option {
            background: var(--deep-space);
            color: var(--stardust);
            padding: 0.5rem;
        }

        /* Series Navigation - Buttons at bottom */
        .series-nav-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 2rem 0;
            padding: 1.5rem;
            background: linear-gradient(135deg, rgba(45, 27, 78, 0.4), rgba(107, 63, 160, 0.2));
            border: 1px solid rgba(107, 63, 160, 0.3);
            border-radius: 15px;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .series-nav-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.8rem 1.5rem;
            background: linear-gradient(135deg, var(--stellar-purple), var(--nova-pink));
            border: none;
            border-radius: 25px;
            color: var(--pure-light);
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px var(--glow-pink);
        }

        .series-nav-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px var(--glow-pink);
        }

        .series-nav-btn.disabled {
            background: rgba(107, 63, 160, 0.3);
            color: rgba(233, 213, 255, 0.5);
            cursor: not-allowed;
            box-shadow: none;
        }

        .series-nav-btn.disabled:hover {
            transform: none;
            box-shadow: none;
        }

        .series-nav-btn svg {
            width: 18px;
            height: 18px;
        }

        .series-nav-info {
            font-size: 0.9rem;
            color: var(--stardust);
            text-align: center;
        }

        @media (max-width: 768px) {
            .series-nav-bottom {
                flex-direction: column;
                text-align: center;
            }

            .series-nav-btn {
                width: 100%;
                justify-content: center;
            }

            .series-select {
                width: 100%;
                min-width: unset;
            }
        }

        /* Reading Actions - Removed as Scriptbin button is removed from this page */
        .reading-actions {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }

        .action-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.7rem 1.4rem;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .action-btn.scriptbin {
            background: rgba(107, 63, 160, 0.3);
            color: var(--stardust);
            border: 1px solid rgba(107, 63, 160, 0.5);
        }

        .action-btn.scriptbin:hover {
            background: var(--stellar-purple);
            box-shadow: 0 0 20px var(--glow-purple);
        }

        /* Script Content */
        .script-content {
            background: var(--reading-bg);
            border-radius: 20px;
            padding: 3rem;
            border: 1px solid rgba(107, 63, 160, 0.2);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        /* Markdown Styling */
        .script-content h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            color: var(--pure-light);
            margin: 2.5rem 0 1.5rem;
            padding-bottom: 0.8rem;
            border-bottom: 1px solid rgba(107, 63, 160, 0.3);
        }

        .script-content h1:first-child {
            margin-top: 0;
        }

        .script-content h2 {
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            color: var(--cosmic-pink);
            margin: 2rem 0 1rem;
        }

        .script-content h3 {
            font-family: 'Raleway', sans-serif;
            font-size: 1.1rem;
            color: var(--stardust);
            margin: 1.5rem 0 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .script-content p {
            font-family: 'Crimson Pro', serif;
            font-size: 1.15rem;
            line-height: 1.9;
            color: var(--reading-text);
            margin-bottom: 1.2rem;
        }

        .script-content strong {
            color: var(--cosmic-pink);
            font-weight: 600;
        }

        .script-content em {
            color: rgba(233, 213, 255, 0.7);
            font-style: italic;
        }

        .script-content hr {
            border: none;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--stellar-purple), transparent);
            margin: 2.5rem 0;
        }

        .script-content blockquote {
            border-left: 3px solid var(--nova-pink);
            padding-left: 1.5rem;
            margin: 1.5rem 0;
            font-style: italic;
            color: rgba(233, 213, 255, 0.8);
        }

        .script-content ul, .script-content ol {
            margin: 1rem 0 1.5rem 1.5rem;
            font-family: 'Crimson Pro', serif;
            font-size: 1.15rem;
            line-height: 1.8;
            color: var(--reading-text);
        }

        .script-content li {
            margin-bottom: 0.5rem;
        }

        .script-content code {
            background: rgba(107, 63, 160, 0.3);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.95rem;
        }

        .script-content pre {
            background: rgba(0, 0, 0, 0.3);
            padding: 1.5rem;
            border-radius: 10px;
            overflow-x: auto;
            margin: 1.5rem 0;
        }

        .script-content pre code {
            background: none;
            padding: 0;
        }

        /* Loading State */
        .loading-state {
            text-align: center;
            padding: 4rem 2rem;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(107, 63, 160, 0.3);
            border-top-color: var(--nova-pink);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1.5rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-state p {
            color: var(--cosmic-pink);
            font-size: 1.1rem;
        }

        /* Error State */
        .error-state {
            text-align: center;
            padding: 4rem 2rem;
        }

        .error-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .error-title {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            color: var(--pure-light);
            margin-bottom: 1rem;
        }

        .error-message {
            color: rgba(233, 213, 255, 0.7);
            margin-bottom: 2rem;
        }

        .error-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.8rem 1.5rem;
            background: linear-gradient(135deg, var(--stellar-purple), var(--nova-pink));
            color: var(--pure-light);
            text-decoration: none;
            border-radius: 25px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .error-btn:hover {
            box-shadow: 0 0 25px var(--glow-pink);
            transform: translateY(-2px);
        }

        /* Patreon Gate Page */
        .patreon-gate {
            text-align: center;
            padding: 4rem 2rem;
            max-width: 500px;
            margin: 0 auto;
        }

        .patreon-gate-icon {
            color: #ff5500;
            margin-bottom: 1.5rem;
        }

        .patreon-gate-title {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            color: #ff5500;
            margin-bottom: 0.5rem;
        }

        .patreon-gate-script-title {
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            color: var(--pure-light);
            margin-bottom: 1.5rem;
            line-height: 1.3;
        }

        .patreon-gate-text {
            color: rgba(233, 213, 255, 0.8);
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .patreon-gate-input-group {
            margin-bottom: 2rem;
        }

        .patreon-gate-input {
            width: 100%;
            max-width: 300px;
            padding: 1rem 1.2rem;
            background: rgba(18, 16, 31, 0.8);
            border: 1px solid rgba(255, 85, 0, 0.3);
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .patreon-gate-input:focus {
            outline: none;
            border-color: #ff5500;
            box-shadow: 0 0 20px rgba(255, 85, 0, 0.3);
        }

        .patreon-gate-input.error {
            border-color: #ff6b6b;
            box-shadow: 0 0 15px rgba(255, 107, 107, 0.3);
        }

        .patreon-gate-input::placeholder {
            color: rgba(233, 213, 255, 0.5);
        }

        .patreon-gate-error {
            color: #ff6b6b;
            font-size: 0.9rem;
            margin-top: 0.8rem;
            display: none;
        }

        .patreon-gate-buttons {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
        }

        .patreon-gate-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.9rem 1.8rem;
            border-radius: 25px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            text-decoration: none;
            min-width: 220px;
        }

        .patreon-gate-btn.unlock {
            background: linear-gradient(135deg, var(--stellar-purple), var(--nova-pink));
            color: #fff;
            box-shadow: 0 0 20px var(--glow-pink);
        }

        .patreon-gate-btn.unlock:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 35px var(--glow-pink);
        }

        .patreon-gate-btn.patreon {
            background: linear-gradient(135deg, #ff5500, #ff7733);
            color: #fff;
            box-shadow: 0 0 20px rgba(255, 85, 0, 0.4);
        }

        .patreon-gate-btn.patreon:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 35px rgba(255, 85, 0, 0.6);
        }

        .patreon-gate-btn.back {
            background: transparent;
            color: var(--stardust);
            border: 1px solid rgba(107, 63, 160, 0.5);
        }

        .patreon-gate-btn.back:hover {
            background: rgba(107, 63, 160, 0.3);
            border-color: rgba(107, 63, 160, 0.8);
        }

        /* Preview Fade Gate - for Patreon script previews */
        .preview-content {
            position: relative;
        }

        .preview-fade-overlay {
            position: relative;
            margin-top: -150px;
            padding-top: 150px;
            background: linear-gradient(to bottom, 
                transparent 0%,
                rgba(13, 11, 20, 0.7) 30%,
                rgba(13, 11, 20, 0.95) 60%,
                var(--void) 100%
            );
        }

        .preview-end-message {
            padding: 3rem 2rem;
            text-align: center;
            background: var(--void);
        }

        .preview-end-message h3 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.4rem;
            color: var(--starlight);
            margin-bottom: 0.5rem;
        }

        .preview-end-message p {
            color: var(--stardust);
            opacity: 0.8;
            margin-bottom: 1.5rem;
        }

        .preview-end-message .manual-unlock-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.8rem 1.5rem;
            background: linear-gradient(135deg, var(--deep-purple), var(--cosmic-pink));
            border: none;
            border-radius: 10px;
            color: white;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .preview-end-message .manual-unlock-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(217, 70, 168, 0.4);
        }

        /* Preview Top Unlock Bar */
        .preview-top-bar {
            background: linear-gradient(135deg, rgba(45, 27, 78, 0.9), rgba(26, 20, 46, 0.95));
            border: 1px solid rgba(107, 63, 160, 0.4);
            border-radius: 16px;
            padding: 1.5rem 2rem;
            margin-bottom: 2rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .preview-top-bar-text {
            flex: 1;
            min-width: 200px;
        }

        .preview-top-bar-text h3 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--starlight);
            margin-bottom: 0.3rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .preview-top-bar-text h3 svg {
            color: var(--cosmic-pink);
        }

        .preview-top-bar-text p {
            font-size: 0.9rem;
            color: var(--stardust);
            opacity: 0.8;
            margin: 0;
        }

        .preview-top-bar-form {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .preview-top-bar-input {
            padding: 0.7rem 1rem;
            border-radius: 10px;
            border: 2px solid rgba(107, 63, 160, 0.5);
            background: rgba(13, 11, 20, 0.6);
            color: var(--starlight);
            font-size: 0.95rem;
            width: 180px;
            transition: all 0.3s ease;
        }

        .preview-top-bar-input:focus {
            outline: none;
            border-color: var(--cosmic-pink);
            box-shadow: 0 0 15px rgba(217, 70, 168, 0.2);
        }

        .preview-top-bar-input::placeholder {
            color: rgba(233, 213, 255, 0.4);
        }

        .preview-top-bar-btn {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.7rem 1.2rem;
            background: linear-gradient(135deg, var(--deep-purple), var(--cosmic-pink));
            border: none;
            border-radius: 10px;
            color: white;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .preview-top-bar-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(217, 70, 168, 0.4);
        }

        .preview-top-bar-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .preview-top-bar-error {
            width: 100%;
            color: #ef4444;
            font-size: 0.85rem;
            margin-top: 0.5rem;
            display: none;
        }

        .preview-top-bar-link {
            color: var(--cosmic-pink);
            font-size: 0.9rem;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            transition: opacity 0.2s ease;
        }

        .preview-top-bar-link:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        /* Preview Notice Banner */
        .preview-notice {
            background: linear-gradient(135deg, rgba(255, 66, 77, 0.15), rgba(217, 70, 168, 0.15));
            border: 1px solid rgba(255, 66, 77, 0.3);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .preview-notice-icon {
            color: #FF424D;
            flex-shrink: 0;
        }

        .preview-notice-text {
            font-size: 0.95rem;
            color: var(--stardust);
        }

        .preview-notice-text strong {
            color: var(--starlight);
        }

        @media (max-width: 768px) {
            .preview-top-bar {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }

            .preview-top-bar-form {
                justify-content: center;
            }

            .preview-top-bar-input {
                width: 100%;
                max-width: 250px;
            }
        }

        /* Modal Overlay */
        .preview-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 11, 20, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .preview-modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .preview-modal {
            position: relative;
            background: linear-gradient(135deg, rgba(45, 27, 78, 0.95), rgba(13, 11, 20, 0.98));
            border: 1px solid rgba(107, 63, 160, 0.5);
            border-radius: 20px;
            padding: 3rem 2.5rem;
            max-width: 450px;
            width: 90%;
            text-align: center;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5), 0 0 40px rgba(217, 70, 168, 0.2);
            transform: translateY(20px) scale(0.95);
            transition: transform 0.5s ease;
        }

        .preview-modal-overlay.active .preview-modal {
            transform: translateY(0) scale(1);
        }

        .preview-modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: transparent;
            border: none;
            color: var(--stardust);
            cursor: pointer;
            padding: 0.5rem;
            opacity: 0.7;
            transition: opacity 0.2s ease;
        }

        .preview-modal-close:hover {
            opacity: 1;
        }

        .preview-modal-icon {
            color: var(--cosmic-pink);
            margin-bottom: 1.5rem;
        }

        .preview-modal-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--starlight);
            margin-bottom: 0.5rem;
        }

        .preview-modal-subtitle {
            font-size: 1.1rem;
            color: var(--stardust);
            margin-bottom: 2rem;
            opacity: 0.9;
        }

        .preview-modal-input-group {
            margin-bottom: 1.5rem;
        }

        .preview-modal-input {
            width: 100%;
            padding: 1rem 1.2rem;
            border-radius: 12px;
            border: 2px solid rgba(107, 63, 160, 0.5);
            background: rgba(45, 27, 78, 0.4);
            color: var(--starlight);
            font-size: 1rem;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .preview-modal-input:focus {
            outline: none;
            border-color: var(--cosmic-pink);
            box-shadow: 0 0 20px rgba(217, 70, 168, 0.3);
        }

        .preview-modal-input.error {
            border-color: #ef4444;
            animation: shake 0.5s ease-in-out;
        }

        .preview-modal-input::placeholder {
            color: rgba(233, 213, 255, 0.5);
        }

        .preview-modal-error {
            color: #ef4444;
            font-size: 0.9rem;
            margin-top: 0.8rem;
            display: none;
        }

        .preview-modal-loading {
            color: var(--cosmic-pink);
            font-size: 0.9rem;
            margin-top: 0.8rem;
        }

        .preview-modal-buttons {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .preview-modal-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
        }

        .preview-modal-btn.unlock {
            background: linear-gradient(135deg, var(--deep-purple), var(--cosmic-pink));
            color: white;
        }

        .preview-modal-btn.unlock:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(217, 70, 168, 0.4);
        }

        .preview-modal-btn.unlock:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .preview-modal-btn.patreon {
            background: #FF424D;
            color: white;
        }

        .preview-modal-btn.patreon:hover {
            background: #e03a44;
            transform: translateY(-2px);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        @media (max-width: 768px) {
            .preview-modal {
                padding: 2rem 1.5rem;
                margin: 1rem;
            }
            
            .preview-modal-title {
                font-size: 1.5rem;
            }
        }

        /* Footer Navigation */
        .footer-nav {
            max-width: 900px;
            margin: 3rem auto 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .script-title {
                font-size: 2rem;
            }

            .script-content {
                padding: 2rem 1.5rem;
            }

            .script-content p {
                font-size: 1.05rem;
            }

            main {
                padding: 2rem 1rem 4rem;
            }

            .logo-mini-text {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .script-title {
                font-size: 1.6rem;
            }

            .header-content {
                flex-direction: row;
            }

            .back-link span {
                display: none;
            }
        }

        /* Accessibility Button */
        .accessibility-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            background: rgba(107, 63, 160, 0.3);
            border: 1px solid rgba(107, 63, 160, 0.5);
            border-radius: 50%;
            color: #e9d5ff;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .accessibility-btn:hover {
            background: rgba(217, 70, 168, 0.4);
            border-color: #d946a8;
            box-shadow: 0 0 15px rgba(217, 70, 168, 0.4);
        }

        .accessibility-btn svg {
            width: 22px;
            height: 22px;
        }

        /* Accessibility Panel */
        .accessibility-panel {
            position: fixed;
            top: 0;
            right: -350px;
            width: 320px;
            height: 100vh;
            background: linear-gradient(180deg, rgba(18, 16, 31, 0.98) 0%, rgba(10, 10, 18, 0.98) 100%);
            border-left: 1px solid rgba(107, 63, 160, 0.4);
            z-index: 10000;
            padding: 2rem;
            overflow-y: auto;
            transition: right 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .accessibility-panel.open {
            right: 0;
        }

        .accessibility-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .accessibility-overlay.open {
            opacity: 1;
            visibility: visible;
        }

        .accessibility-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(107, 63, 160, 0.3);
        }

        .accessibility-title {
            font-family: 'Cinzel', serif;
            font-size: 1.3rem;
            color: #faf5ff;
        }

        .accessibility-close {
            background: none;
            border: none;
            color: #e9d5ff;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .accessibility-close:hover {
            background: rgba(107, 63, 160, 0.3);
            color: #f472b6;
        }

        .accessibility-section {
            margin-bottom: 2rem;
        }

        .accessibility-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #f472b6;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 1rem;
            display: block;
        }

        /* Font Size Controls */
        .font-size-controls {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .font-size-btn {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            border: 1px solid rgba(107, 63, 160, 0.5);
            background: rgba(107, 63, 160, 0.2);
            color: #e9d5ff;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;

        /* Font Family Classes */
        body.font-arial,
        body.font-arial .script-content,
        body.font-arial .script-content p { font-family: Arial, sans-serif !important; }
        body.font-arial .script-title,

        body.font-times,

        body.font-times .accessibility-title { font-family: 'Times New Roman', Times, serif !important; }

        body.font-atkinson,

    <script>
        // Configuration
        const CONFIG = {
            dataPath: './data/scripts.json',
            workerApiUrl: 'https://patreon-script-api.isapethscriptweaver.workers.dev'
        };

        // Store script data for API calls
        let currentScriptData = null;
        let allScriptsData = null;

        // Get script ID from URL
        function getScriptId() {
            const params = new URLSearchParams(window.location.search);
            return parseInt(params.get('id'));
        }

        // Format category name
        function formatCategory(category) {
            if (category === 'daytoday') return 'Day-to-Day';
            if (category === 'scifi') return 'Sci-Fi';
            return category.charAt(0).toUpperCase() + category.slice(1);
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Toggle hidden tags visibility
        function toggleTags() {
            const hiddenTags = document.getElementById('hiddenTags');
            const toggleBtn = document.getElementById('tagsToggle');
            
            if (hiddenTags && toggleBtn) {
                const isVisible = hiddenTags.classList.contains('visible');
                
                if (isVisible) {
                    hiddenTags.classList.remove('visible');
                    const tagCount = hiddenTags.querySelectorAll('.script-tag').length;
                    toggleBtn.textContent = `+${tagCount} more`;
                } else {
                    hiddenTags.classList.add('visible');
                    toggleBtn.textContent = 'Show less';
                }
            }
        }

        // Build tags HTML with collapsible "show more" for many tags
        function buildTagsHTML(tags, maxVisible = 6) {
            if (!tags || tags.length === 0) return '';
            
            const visibleTags = tags.slice(0, maxVisible);
            const hiddenTags = tags.slice(maxVisible);
            
            let html = visibleTags.map(tag => 
                `<span class="script-tag">${escapeHtml(tag)}</span>`
            ).join('');
            
            if (hiddenTags.length > 0) {
                const hiddenTagsHTML = hiddenTags.map(tag => 
                    `<span class="script-tag">${escapeHtml(tag)}</span>`
                ).join('');
                html += `
                    <span class="script-tags-hidden" id="hiddenTags">${hiddenTagsHTML}</span>
                    <button class="script-tags-toggle" id="tagsToggle" onclick="toggleTags()">+${hiddenTags.length} more</button>
                `;
            }
            
            return html;
        }

        // Render error state
        function renderError(message) {
            document.getElementById('mainContent').innerHTML = `
                <div class="error-state">
                    <div class="error-icon">📜</div>
                    <h1 class="error-title">Script Not Found</h1>
                    <p class="error-message">${message}</p>
                    <a href="index.html" class="error-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                        </svg>
                        Return to Masterlist
                    </a>
                </div>
            `;
        }

        // Render script page
        function renderScript(script, content, allScripts, condensedContent = null) {
            // Update page title
            document.title = `${script.title} | The Immaterial Loom`;

            // Get current page URL for sharing
            const pageUrl = window.location.href;
            const shareTitle = encodeURIComponent(script.title);
            const shareUrl = encodeURIComponent(pageUrl);

            // Build share buttons HTML
            const shareButtonsHTML = `
                <div class="share-section">
                    <p class="share-title">Share this script</p>

                        </a>

                            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                        </a>
                        <a href="https://bsky.app/intent/compose?text=${shareTitle}%20${shareUrl}" target="_blank" rel="noopener noreferrer" class="share-btn bluesky" title="Share on Bluesky">
                            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 10.8c-1.087-2.114-4.046-6.053-6.798-7.995C2.566.944 1.561 1.266.902 1.565.139 1.908 0 3.08 0 3.768c0 .69.378 5.65.624 6.479.815 2.736 3.713 3.66 6.383 3.364.136-.02.275-.039.415-.056-.138.022-.276.04-.415.056-3.912.58-7.387 2.005-2.83 7.078 5.013 5.19 6.87-1.113 7.823-4.308.953 3.195 2.05 9.271 7.733 4.308 4.267-4.308 1.172-6.498-2.74-7.078a8.741 8.741 0 0 1-.415-.056c.14.017.279.036.415.056 2.67.297 5.568-.628 6.383-3.364.246-.828.624-5.79.624-6.478 0-.69-.139-1.861-.902-2.206-.659-.298-1.664-.62-4.3 1.24C16.046 4.748 13.087 8.687 12 10.8z"/></svg>
                        </a>
                        <button class="share-btn discord" title="Copy for Discord" onclick="copyToClipboard('${script.title}\\n${pageUrl}')">
                            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
                        </button>
                        <button class="share-btn copy" id="copyLinkBtn" title="Copy Link" onclick="copyToClipboard('${pageUrl}')">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                        </button>
                    </div>
                </div>
            `;

            // Build cover image HTML (after tags)
            let coverImageHTML = '';
            if (script.image) {
                let artistCredit = '';
                if (script.artist) {
                    if (script.artistLink) {
                        artistCredit = `<div class="script-cover-credit">Art by <a href="${escapeHtml(script.artistLink)}" target="_blank" rel="noopener noreferrer">${escapeHtml(script.artist)}</a></div>`;
                    } else {
                        artistCredit = `<div class="script-cover-credit">Art by ${escapeHtml(script.artist)}</div>`;
                    }
                }
                coverImageHTML = `
                    <div class="script-cover">
                        <img src="${escapeHtml(script.image)}" alt="${escapeHtml(script.title)} cover art">
                        ${artistCredit}
                    </div>
                `;
            }

            // Build fills section HTML
            let fillsHTML = '';
            if (script.fills && script.fills.length > 0) {
                const fillItems = script.fills.map(fill => {
                    // Build artists list with links
                    const artistLinks = fill.artists.map(artist => {
                        if (artist.reddit) {
                            return `<a href="${escapeHtml(artist.reddit)}" target="_blank" rel="noopener noreferrer">${escapeHtml(artist.name)}</a>`;
                        }
                        return `<span>${escapeHtml(artist.name)}</span>`;
                    }).join('<span class="artist-separator"> & </span>');

                    return `
                        <div class="fill-item">
                            <div class="fill-artists">
                                <span>By:</span> ${artistLinks}
                            </div>
                            <a href="${escapeHtml(fill.postLink)}" target="_blank" rel="noopener noreferrer" class="fill-link">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701z"/>
                                </svg>
                                Listen on Reddit
                            </a>
                        </div>
                    `;
                }).join('');

                fillsHTML = `
                    <div class="fills-section">
                        <h3 class="fills-title">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15.536a5 5 0 001.414 1.414m2.828-9.9a9 9 0 0112.728 0" />
                            </svg>
                            This script has fills!
                        </h3>
                        <div class="fills-list">
                            ${fillItems}
                        </div>
                    </div>
                `;
            }

            // Build related scripts section
            let relatedHTML = '';
            if (allScripts && allScripts.length > 1) {
                const relatedScripts = findRelatedScripts(script, allScripts, 3);
                if (relatedScripts.length > 0) {
                    const relatedCards = relatedScripts.map(related => createRelatedCard(related)).join('');

                    relatedHTML = `
                        <div class="related-section">
                            <h3 class="related-title">You might also like...</h3>
                            <div class="related-grid">
                                ${relatedCards}
                            </div>
                        </div>
                    `;
                }
            }

            // Build series navigation (dropdown at top, buttons at bottom)
            let seriesDropdownHTML = '';
            let seriesNavBottomHTML = '';
            
            if (script.seriesId) {
                // Get all parts in this series
                const seriesParts = getSeriesParts(script.seriesId, allScripts);
                
                // Build dropdown options
                const dropdownOptions = seriesParts.map(part => {
                    const selected = part.id === script.id ? 'selected' : '';
                    return `<option value="${part.id}" ${selected}>Part ${part.partNumber}: ${escapeHtml(part.title)}</option>`;
                }).join('');

                seriesDropdownHTML = `
                    <div class="series-dropdown">
                        <span class="series-label">📖 This is part of a series:</span>
                        <select class="series-select" onchange="navigateToSeriesPart(this.value)">
                            ${dropdownOptions}
                        </select>
                    </div>
                `;

                // Build bottom navigation buttons
                const prevPart = script.previousPart ? allScripts.find(s => s.id === script.previousPart) : null;
                const nextPart = script.nextPart ? allScripts.find(s => s.id === script.nextPart) : null;

                const prevBtnHTML = prevPart 
                    ? `<a href="reader.html?id=${prevPart.id}" class="series-nav-btn">
                           <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                               <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                           </svg>
                           Previous Part
                       </a>`
                    : `<span class="series-nav-btn disabled">
                           <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                               <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                           </svg>
                           Previous Part
                       </span>`;

                const nextBtnHTML = nextPart 
                    ? `<a href="reader.html?id=${nextPart.id}" class="series-nav-btn">
                           Next Part
                           <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                               <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                           </svg>
                       </a>`
                    : `<span class="series-nav-btn disabled">
                           Next Part
                           <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                               <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                           </svg>
                       </span>`;

                seriesNavBottomHTML = `
                    <div class="series-nav-bottom">
                        ${prevBtnHTML}
                        <span class="series-nav-info">Part ${script.partNumber} of ${script.totalParts}</span>
                        ${nextBtnHTML}
                    </div>
                `;
            }

            // Parse markdown content
            const parsedContent = marked.parse(content);
            const parsedCondensedContent = condensedContent ? marked.parse(condensedContent) : null;

            // Build version toggle HTML (only if condensed version exists)
            let versionToggleHTML = '';
            if (parsedCondensedContent) {
                const savedVersion = localStorage.getItem('scriptVersionPreference') || 'full';
                const isCondensed = savedVersion === 'condensed';
                
                versionToggleHTML = `
                    <div class="version-toggle-container">
                        <div class="version-toggle">
                            <span class="version-toggle-label ${!isCondensed ? 'active' : ''}" onclick="setScriptVersion('full')">Full Script</span>
                            <div class="version-toggle-switch ${isCondensed ? 'condensed' : ''}" onclick="toggleScriptVersion()"></div>
                            <span class="version-toggle-label ${isCondensed ? 'active' : ''}" onclick="setScriptVersion('condensed')">Condensed</span>
                            <span class="version-info" title="Condensed version removes SFX cues and stage directions">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                </svg>
                            </span>
                        </div>
                    </div>
                `;
            }

            // Determine which content to show initially
            const savedVersion = localStorage.getItem('scriptVersionPreference') || 'full';
            const initialContent = (savedVersion === 'condensed' && parsedCondensedContent) 
                ? parsedCondensedContent 
                : parsedContent;

            document.getElementById('mainContent').innerHTML = `
                <article>
                    <header class="script-header">
                        <span class="script-category">${formatCategory(script.category)}</span>
                        <h1 class="script-title">${escapeHtml(script.title)}</h1>
                        <div class="script-tags">
                            ${buildTagsHTML(script.tags)}

        function setScriptVersion(version) {
            if (!window.scriptVersions) return;
            
            localStorage.setItem('scriptVersionPreference', version);
            
            // Update content
            const contentArea = document.getElementById('scriptContentArea');
            if (contentArea && window.scriptVersions[version]) {
                contentArea.innerHTML = window.scriptVersions[version];
            }
            
            // Update toggle UI
            const toggleSwitch = document.querySelector('.version-toggle-switch');
            const labels = document.querySelectorAll('.version-toggle-label');
            
            if (toggleSwitch) {
                toggleSwitch.classList.toggle('condensed', version === 'condensed');
            }
            
            labels.forEach(label => {
                const labelVersion = label.textContent.toLowerCase().includes('full') ? 'full' : 'condensed';

            });

        // Get all parts in a series, sorted by part number
        function getSeriesParts(seriesId, allScripts) {
            return allScripts
                .filter(s => s.seriesId === seriesId)
                .sort((a, b) => a.partNumber - b.partNumber);
        }

        function navigateToSeriesPart(scriptId) {

        // Find related scripts based on shared tags
        function findRelatedScripts(currentScript, allScripts, count) {
            // Include scripts that have content OR are Patreon-only (content comes from API)
            const otherScripts = allScripts.filter(s => 
                s.id !== currentScript.id && 
                (s.contentFile || s.patreonOnly) && 
                !s.hidden
            );
            
            // Score each script by number of shared tags
            const scored = otherScripts.map(script => {
                const sharedTags = script.tags.filter(tag => 
                    currentScript.tags.some(t => t.toLowerCase() === tag.toLowerCase())
                );
                return { script, score: sharedTags.length };
            });

            // Sort by score descending and take top N
            scored.sort((a, b) => b.score - a.score);
            return scored.slice(0, count).filter(s => s.score > 0).map(s => s.script);
        }

        // Toggle tags in related cards
        function toggleRelatedTags(btn) {
            const tagsContainer = btn.parentElement;
            const hiddenTags = tagsContainer.querySelectorAll('.tag.hidden');
            const isExpanded = btn.dataset.expanded === 'true';
            
            if (isExpanded) {
                const allTags = tagsContainer.querySelectorAll('.tag');
                allTags.forEach((tag, idx) => {
                    if (idx >= 5) {
                        tag.classList.add('hidden');
                    }
                });
                const hiddenCount = allTags.length - 5;
                btn.textContent = `+${hiddenCount} more`;
                btn.dataset.expanded = 'false';
            } else {
                hiddenTags.forEach(tag => {
                    tag.classList.remove('hidden');
                });
                btn.textContent = 'Show less';
                btn.dataset.expanded = 'true';
            }
        }

        async function submitPatreonGateKey(scriptId) {
            const input = document.getElementById('patreonGateInput');
            const errorEl = document.getElementById('patreonGateError');
            const loadingEl = document.getElementById('patreonGateLoading');
            const unlockBtn = document.getElementById('unlockBtn');
            
            if (!input) return;
            
            const password = input.value.trim();
            
            if (!password) {
                errorEl.textContent = 'Please enter a password.';
                errorEl.style.display = 'block';
                input.classList.add('error');
                return;
            }
            
            // Show loading state
            errorEl.style.display = 'none';
            loadingEl.style.display = 'block';
            unlockBtn.disabled = true;
            input.disabled = true;
            
            try {
                const response = await fetch(`${CONFIG.workerApiUrl}/api/patreon-script/${scriptId}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ password: password })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    // Password valid! Store access for this session
                    sessionStorage.setItem(`patreon_access_${scriptId}`, 'granted');
                    sessionStorage.setItem(`patreon_pw_${scriptId}`, password);
                    
                    // Render the script with the content from the API (including condensed version if available)
                    renderScript(currentScriptData, data.content, allScriptsData, data.condensedContent || null);
                    
                    // Setup scroll tracking
                    setupScrollTracking(scriptId);
                    
                } else {
                    // Password invalid
                    loadingEl.style.display = 'none';
                    errorEl.textContent = data.error || 'Incorrect password. Please try again.';
                    errorEl.style.display = 'block';
                    input.classList.add('error');
                    unlockBtn.disabled = false;
                    input.disabled = false;
                    input.focus();
                    input.select();
                }
                
            } catch (error) {
                console.error('API Error:', error);
                loadingEl.style.display = 'none';
                errorEl.textContent = 'Connection error. Please try again.';
                errorEl.style.display = 'block';
                unlockBtn.disabled = false;
                input.disabled = false;
            }
        }
